<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESEOS</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HOME -->

    <div id="home-screen">

        <div class="title">
            DESEOS
        </div>

        <div class="users">

            <button id="fernando-btn" class="fernando">
                Fernando
            </button>

            <button id="debora-btn" class="debora">
                Debora
            </button>

        </div>

        <div id="cloud-container"></div>

        <button id="history-btn" class="history-button">
            Deseos cumplidos
        </button>

    </div>

    <!-- EDITOR -->

    <div id="editor-screen" class="hidden">

        <h2 id="selected-user"></h2>

        <textarea
            id="wish-text"
            placeholder="Escribe tu deseo..."
        ></textarea>

        <div>

            <button id="back-btn">
                Volver
            </button>

            <button id="save-btn">
                Guardar
            </button>

        </div>

    </div>

    <!-- DETALLE -->

    <div id="detail-screen" class="hidden">

        <h2>Deseo</h2>

        <div id="selected-wish"></div>

        <button id="complete-btn">
            Cumplido
        </button>

        <button id="detail-back-btn">
            Volver
        </button>

    </div>

    <!-- HISTORICO -->

    <div id="history-screen" class="hidden">

        <h2>Deseos cumplidos</h2>

        <div id="history-container"></div>

        <button id="history-back-btn">
            Volver
        </button>

    </div>

    <script type="module" src="app.js"></script>

</body>

</html>
